<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meu ManyChat — Painel</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; color: #222; background: #fafafa; }
  h1 { font-size: 24px; margin-bottom: 16px; }
  h2 { font-size: 18px; margin: 0; }
  .box { padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .box.warn { background: #fff3e0; }
  .box.ok { background: #e8f5e9; }
  .btn { display: inline-block; padding: 10px 16px; background: #111; color: #fff; border-radius: 8px; text-decoration: none; border: none; cursor: pointer; font-size: 14px; }
  .btn.primary { background: #ff5a1f; }
  .btn.small { padding: 6px 12px; font-size: 13px; margin-right: 8px; margin-top: 8px; }
  .btn.danger { background: #fff; color: #d33; border: 1px solid #d33; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 12px; }
  .card { padding: 16px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 12px; background: #fff; }
  .card .top { display: flex; justify-content: space-between; }
  .meta { font-size: 13px; color: #666; margin-top: 4px; }
  .active { color: green; font-weight: 600; }
  .paused { color: #999; }
  .empty { color: #666; }
  a.link { color: #ff5a1f; }
</style>
</head>
<body>
  <h1>Painel — Meu ManyChat</h1>

  <div id="connection-box"></div>

  <div class="row">
    <h2>Automações</h2>
    <a href="/new-automation.html" class="btn primary">+ Nova automação</a>
  </div>

  <div id="automations-list"></div>

<script>
async function loadConfig() {
  const res = await fetch('/api/config');
  const { config } = await res.json();
  const box = document.getElementById('connection-box');
  if (!config || !config.access_token) {
    box.innerHTML = `
      <div class="box warn">
        <p>Seu Instagram ainda não está conectado.</p>
        <a href="/api/oauth/start" class="btn">Conectar Instagram</a>
      </div>`;
  } else {
    box.innerHTML = `<div class="box ok">Conectado como <b>@${config.ig_username}</b></div>`;
  }
}

async function toggleAutomation(id, active) {
  await fetch('/api/automations/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ active })
  });
  loadAutomations();
}

async function deleteAutomation(id) {
  if (!confirm('Excluir esta automação?')) return;
  await fetch('/api/automations/' + id, { method: 'DELETE' });
  loadAutomations();
}

async function loadAutomations() {
  const res = await fetch('/api/automations');
  const { automations } = await res.json();
  const list = document.getElementById('automations-list');

  if (!automations || automations.length === 0) {
    list.innerHTML = '<p class="empty">Nenhuma automação criada ainda.</p>';
    return;
  }

  list.innerHTML = automations.map(a => {
    const gatilhos = [
      a.trigger_comment && 'comentário',
      a.trigger_story_reply && 'story',
      a.trigger_dm && 'DM'
    ].filter(Boolean).join(', ');

    return `
      <div class="card">
        <div class="top">
          <b>${escapeHtml(a.name)}</b>
          <span class="${a.active ? 'active' : 'paused'}">${a.active ? 'Ativa' : 'Pausada'}</span>
        </div>
        <div class="meta">
          Palavras: ${a.keywords.join(', ') || '(qualquer)'} · Gatilhos: ${gatilhos}
        </div>
        <button class="btn small" onclick="toggleAutomation('${a.id}', ${!a.active})">${a.active ? 'Pausar' : 'Ativar'}</button>
        <button class="btn small danger" onclick="deleteAutomation('${a.id}')">Excluir</button>
      </div>`;
  }).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

loadConfig();
loadAutomations();
</script>
</body>
</html>
