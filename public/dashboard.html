<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Central de Sinal — igautochat</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<script src="/auth.js"></script>
<style>
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
  .stats-strip {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface);
    padding: 14px 16px;
  }
  .stat-card .num { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
  .stat-card .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .stat-card.warn .num { color: var(--accent-red); }
  .banner {
    border: 1.5px solid var(--accent-yellow); background: rgba(255, 197, 103, 0.1); border-radius: var(--radius);
    padding: 12px 16px; font-size: 13px; margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-start;
  }
  .banner.danger { border-color: var(--accent-red); background: rgba(253, 90, 70, 0.1); }

  .events-log { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .event-row {
    display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px;
    border: 0.5px solid var(--border); border-radius: 8px; background: var(--surface);
    font-size: 12.5px;
  }
  .event-row .who { font-family: var(--font-mono); }
  .event-row .status-tag { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
  .status-tag.sent { background: #E6F7EF; color: var(--accent-green); }
  .status-tag.failed { background: #FDEAE8; color: var(--accent-red); }
  .status-tag.pending, .status-tag.sending { background: var(--surface-2); color: var(--text-muted); }
  .status-tag.skipped { background: var(--surface-2); color: var(--text-muted); }
  .event-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  .accounts-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .account-pill {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px;
    border: 0.5px solid var(--border); border-radius: 999px; background: var(--surface);
  }
  .account-pill img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  .account-pill .avatar-empty { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); }
  .account-pill .name { font-size: 13px; font-weight: 600; }
  .account-pill .uname { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .account-pill .rename-btn, .account-pill .disconnect-btn {
    background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; padding: 2px;
  }
  .account-pill .disconnect-btn:hover { color: var(--accent-red); }
  .account-tag {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 10px;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px;
  }
  .add-account-btn { border-radius: 999px; }
</style>
</head>
<body>
  <div class="top-bar">
    <div>
      <div class="brand-row"><img src="/logo.png" alt="" onerror="this.style.display='none'" /><span class="brand-name">igautochat</span></div>
      <div class="eyebrow"><span id="clock-dot" class="dot off"></span> painel · instagram</div>
      <h1>Central de Sinal</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start">
      <a href="/analytics.html" class="btn small">Analytics</a>
      <a href="/kanban.html" class="btn small">Conteúdo</a>
      <a href="/calendario.html" class="btn small">Calendário</a>
      <button class="btn small" id="logout-btn">Sair</button>
    </div>
  </div>

  <div class="accounts-strip" id="accounts-strip"></div>
  <div id="alerts"></div>
  <div class="stats-strip" id="stats-strip"></div>

  <div class="row">
    <h2>Automações<span class="count" id="auto-count"></span></h2>
    <a href="/new-automation.html" class="btn primary">+ Nova automação</a>
  </div>

  <div id="automations-list"></div>

  <div class="row">
    <h2>Atividade recente</h2>
  </div>
  <div class="events-log" id="events-log"></div>

<script>
document.getElementById('logout-btn').addEventListener('click', async () => {
  const sb = await window.initAuth();
  await sb.auth.signOut();
  window.location.href = '/login.html';
});

async function loadAccounts() {
  const res = await authFetch('/api/accounts');
  const { accounts } = await res.json();
  const strip = document.getElementById('accounts-strip');
  const clockDot = document.getElementById('clock-dot');

  clockDot.className = (accounts && accounts.length) ? 'dot live' : 'dot off';

  const pills = (accounts || []).map(acc => `
    <div class="account-pill">
      ${acc.profile_picture_url ? `<img src="${acc.profile_picture_url}" alt="" />` : '<div class="avatar-empty"></div>'}
      <div>
        <div class="name">${escapeHtml(acc.label || acc.ig_username)}</div>
        <div class="uname">@${escapeHtml(acc.ig_username)}</div>
      </div>
      <button class="rename-btn" onclick="renameAccount('${acc.id}', '${escapeHtml(acc.label || acc.ig_username)}')" title="Renomear">✎</button>
      <button class="disconnect-btn" onclick="disconnectAccount('${acc.id}')" title="Desconectar">&times;</button>
    </div>`).join('');

  strip.innerHTML = pills + `<a href="/api/oauth/start" class="btn small add-account-btn primary">+ Conectar outra conta</a>`;
}

async function renameAccount(id, current) {
  const label = prompt('Nome dessa conta:', current);
  if (!label || label === current) return;
  await authFetch('/api/accounts/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label })
  });
  loadAccounts();
}

async function disconnectAccount(id) {
  if (!confirm('Desconectar essa conta? As automações dela ficam pausadas até você reconectar.')) return;
  await authFetch('/api/accounts/' + id, { method: 'DELETE' });
  loadAccounts();
  loadAutomations();
}

async function loadStats() {
  const res = await authFetch('/api/stats');
  const stats = await res.json();
  const strip = document.getElementById('stats-strip');
  const alerts = document.getElementById('alerts');

  strip.innerHTML = `
    <div class="stat-card">
      <div class="num">${stats.sentWeek}</div>
      <div class="lbl">DMs essa semana</div>
    </div>
    <div class="stat-card ${stats.failed24h > 0 ? 'warn' : ''}">
      <div class="num">${stats.failed24h}</div>
      <div class="lbl">falhas nas últimas 24h</div>
    </div>
  `;

  let alertHtml = '';
  if (stats.failed24h > 0) {
    alertHtml += `<div class="banner danger">⚠️ ${stats.failed24h} envio(s) falharam nas últimas 24h. Confira o log de atividade abaixo.</div>`;
  }
  if (stats.tokenExpiresAt) {
    const daysLeft = Math.floor((new Date(stats.tokenExpiresAt) - new Date()) / (1000 * 60 * 60 * 24));
    if (daysLeft < 0) {
      alertHtml += `<div class="banner danger">🔒 Seu token do Instagram expirou. Clique em "Conectar" pra renovar.</div>`;
    } else if (daysLeft <= 7) {
      alertHtml += `<div class="banner">⏳ Seu token do Instagram expira em ${daysLeft} dia(s). A renovação automática deve cuidar disso, mas fique de olho.</div>`;
    }
  }
  alerts.innerHTML = alertHtml;
}

async function toggleAutomation(id, active) {
  await authFetch('/api/automations/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ active })
  });
  loadAutomations();
}

async function deleteAutomation(id) {
  if (!confirm('Excluir esta automação? Essa ação não pode ser desfeita.')) return;
  const res = await authFetch('/api/automations/' + id, { method: 'DELETE' });
  if (!res.ok) {
    const err = await res.json();
    alert('Não consegui excluir: ' + (err.error || 'erro desconhecido'));
    return;
  }
  loadAutomations();
}

async function loadAutomations() {
  const res = await authFetch('/api/automations');
  const { automations } = await res.json();
  const list = document.getElementById('automations-list');
  const count = document.getElementById('auto-count');

  count.textContent = automations && automations.length ? `${automations.length} no total` : '';

  if (!automations || automations.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <span class="big">&#8942;</span>
        Nenhum sinal configurado ainda.<br/>
        Crie a primeira automação pra começar a converter comentários em DM.
      </div>`;
    return;
  }

  list.innerHTML = automations.map(a => {
    const gatilhos = [
      a.trigger_comment && 'comentário',
      a.trigger_story_reply && 'story',
      a.trigger_dm && 'dm'
    ].filter(Boolean).join(' · ') || 'nenhum gatilho';

    const keywords = (a.keywords || []).length
      ? a.keywords.map(k => `<span class="chip">${escapeHtml(k)}</span>`).join('')
      : `<span class="chip">qualquer palavra</span>`;

    const thumb = a.target_media_thumb
      ? `<img src="${a.target_media_thumb}" alt="" class="auto-thumb" />`
      : `<div class="auto-thumb auto-thumb-empty"></div>`;

    const accountTag = a.ig_accounts
      ? `<div class="account-tag">📸 ${escapeHtml(a.ig_accounts.label || a.ig_accounts.ig_username)}</div>`
      : `<div class="account-tag" style="color:var(--accent-red)">⚠ sem conta conectada</div>`;

    return `
      <div class="signal-row">
        ${thumb}
        <span class="dot ${a.active ? 'live' : 'paused'}"></span>
        <div class="content">
          <div class="top-line">
            <span class="name">${escapeHtml(a.name)}</span>
            <span class="state ${a.active ? 'live' : 'paused'}">${a.active ? 'no ar' : 'pausada'}</span>
          </div>
          <div class="meta">Gatilhos: ${gatilhos}</div>
          <div class="chips">${keywords}</div>
          ${accountTag}
          <div class="actions">
            <a href="/new-automation.html?id=${a.id}" class="btn small">Editar</a>
            <button class="btn small" onclick="toggleAutomation('${a.id}', ${!a.active})">${a.active ? 'Pausar' : 'Ativar'}</button>
            <button class="btn small danger" onclick="deleteAutomation('${a.id}')">Excluir</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function loadEvents() {
  const res = await authFetch('/api/events');
  const { items } = await res.json();
  const log = document.getElementById('events-log');

  if (!items || items.length === 0) {
    log.innerHTML = '<p class="empty" style="padding:20px">Nenhuma atividade ainda.</p>';
    return;
  }

  const kindLabel = { private_reply: 'resposta privada', dm: 'DM', public_reply: 'resposta pública', link: 'link (followup)', reminder: 'lembrete' };

  log.innerHTML = items.map(it => {
    const who = it.contacts?.username ? '@' + it.contacts.username : (it.contacts?.ig_scoped_id || 'contato');
    const autoName = it.automations?.name || '—';
    const time = new Date(it.created_at).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    return `
      <div class="event-row">
        <div>
          <span class="status-tag ${it.status}">${it.status}</span>
          <span class="who"> ${escapeHtml(who)}</span> — ${kindLabel[it.kind] || it.kind} · ${escapeHtml(autoName)}
          ${it.error ? `<div style="color:var(--accent-red);font-family:var(--font-mono);font-size:11px;margin-top:4px">${escapeHtml(it.error).slice(0,120)}</div>` : ''}
        </div>
        <div class="event-time">${time}</div>
      </div>`;
  }).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

(async () => {
  const session = await window.requireAuth();
  if (!session) return; // já foi redirecionado pro login
  loadAccounts();
  loadStats();
  loadAutomations();
  loadEvents();
})();
</script>
</body>
</html>
