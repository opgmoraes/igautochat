<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova automação — Meu ManyChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a href="/dashboard.html" class="back">&larr; voltar pra central</a>
  <div class="eyebrow">novo sinal</div>
  <h1>Nova automação</h1>

  <form id="form">
    <div class="field">
      <label>Nome da automação</label>
      <input name="name" required placeholder="Ex: Ebook grátis" />
    </div>

    <fieldset>
      <legend>Onde escutar</legend>
      <label class="check-row"><input type="checkbox" name="trigger_comment" checked /> Comentário em post/reels</label>
      <label class="check-row"><input type="checkbox" name="trigger_story_reply" /> Resposta a story</label>
      <label class="check-row"><input type="checkbox" name="trigger_dm" /> DM direta</label>
    </fieldset>

    <div class="field">
      <label>Palavras-chave <span class="hint">separadas por vírgula</span></label>
      <input name="keywords" placeholder="quero, link, eu quero" />
    </div>

    <div class="field">
      <label>Tipo de correspondência</label>
      <select name="match_type">
        <option value="contains">Contém a palavra</option>
        <option value="exact">Exatamente igual</option>
        <option value="any">Qualquer comentário</option>
      </select>
    </div>

    <div class="field">
      <label>Post/reels específico <span class="hint">opcional</span></label>
      <select name="target_media_id" id="media-select">
        <option value="">Qualquer post</option>
      </select>
    </div>

    <div class="field">
      <label>Respostas públicas <span class="hint">uma por linha, sorteia entre elas — opcional</span></label>
      <textarea name="public_replies" rows="3" placeholder="Te chamei no direct!&#10;Vai lá no direct que te mandei algo"></textarea>
    </div>

    <div class="field">
      <label>Mensagem de boas-vindas (DM)</label>
      <textarea name="welcome_message" required rows="3" placeholder="Oi! Toca no botão abaixo pra receber o link"></textarea>
    </div>

    <div class="field">
      <label>Rótulo do botão de resposta rápida</label>
      <input name="quick_reply_label" value="Quero!" />
    </div>

    <div class="field">
      <label>Rótulo do botão do link</label>
      <input name="link_label" value="Acessar" />
    </div>

    <div class="field">
      <label>URL do link</label>
      <input name="link_url" placeholder="https://" />
    </div>

    <div class="field">
      <label>Texto do lembrete <span class="hint">opcional</span></label>
      <textarea name="reminder_text" rows="2" placeholder="Ainda não viu? O link continua aqui"></textarea>
    </div>

    <div class="field">
      <label>Atraso do lembrete <span class="hint">minutos</span></label>
      <input name="reminder_delay_minutes" type="number" value="60" />
    </div>

    <button type="submit" class="btn primary submit-btn">Criar automação</button>
    <div id="status"></div>
  </form>

<script>
async function loadMedia() {
  try {
    const res = await fetch('/api/media');
    const { media, error } = await res.json();
    const select = document.getElementById('media-select');
    if (error) {
      const opt = document.createElement('option');
      opt.disabled = true;
      opt.textContent = 'Erro ao buscar posts: ' + error;
      select.appendChild(opt);
      return;
    }
    (media || []).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = (m.caption || m.id).slice(0, 60);
      select.appendChild(opt);
    });
  } catch (e) {
    const select = document.getElementById('media-select');
    const opt = document.createElement('option');
    opt.disabled = true;
    opt.textContent = 'Erro ao buscar posts: ' + e.message;
    select.appendChild(opt);
  }
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  data.trigger_comment = form.trigger_comment.checked;
  data.trigger_story_reply = form.trigger_story_reply.checked;
  data.trigger_dm = form.trigger_dm.checked;

  const status = document.getElementById('status');
  status.className = '';
  status.textContent = 'Criando...';

  const res = await fetch('/api/automations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  if (res.ok) {
    status.className = 'ok';
    status.textContent = 'Criada — voltando pra central...';
    window.location.href = '/dashboard.html';
  } else {
    const err = await res.json();
    status.className = 'error';
    status.textContent = 'Erro: ' + (err.error || 'tente novamente');
  }
});

loadMedia();
</script>
</body>
</html>
