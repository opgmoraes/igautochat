<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova automação</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 0 auto; padding: 24px; color: #222; background: #fafafa; }
  h1 { font-size: 22px; margin-bottom: 16px; }
  label { display: block; margin-bottom: 14px; font-size: 14px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: normal; }
  fieldset { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
  fieldset label { display: block; font-weight: normal; margin-bottom: 4px; }
  .btn { padding: 12px 16px; background: #ff5a1f; color: #fff; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; width: 100%; }
  .back { display: inline-block; margin-bottom: 16px; color: #666; text-decoration: none; font-size: 14px; }
  #status { margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
  <a href="/dashboard.html" class="back">&larr; Voltar</a>
  <h1>Nova automação</h1>

  <form id="form">
    <label>Nome da automação
      <input name="name" required placeholder="Ex: Ebook grátis" />
    </label>

    <fieldset>
      <legend>Onde ativar</legend>
      <label><input type="checkbox" name="trigger_comment" checked /> Comentário em post/reels</label>
      <label><input type="checkbox" name="trigger_story_reply" /> Resposta a story</label>
      <label><input type="checkbox" name="trigger_dm" /> DM direta</label>
    </fieldset>

    <label>Palavras-chave (separadas por vírgula)
      <input name="keywords" placeholder="quero, link, eu quero" />
    </label>

    <label>Tipo de correspondência
      <select name="match_type">
        <option value="contains">Contém a palavra</option>
        <option value="exact">Exatamente igual</option>
        <option value="any">Qualquer comentário</option>
      </select>
    </label>

    <label>Post/reels específico (opcional)
      <select name="target_media_id" id="media-select">
        <option value="">Qualquer post</option>
      </select>
    </label>

    <label>Respostas públicas (uma por linha, sorteia entre elas — opcional)
      <textarea name="public_replies" rows="3" placeholder="Te chamei no direct! &#128521;&#10;Vai lá no direct que te mandei algo"></textarea>
    </label>

    <label>Mensagem de boas-vindas (DM)
      <textarea name="welcome_message" required rows="3" placeholder="Oi! Toca no botão abaixo pra receber o link"></textarea>
    </label>

    <label>Rótulo do botão de resposta rápida
      <input name="quick_reply_label" value="Quero!" />
    </label>

    <label>Rótulo do botão do link
      <input name="link_label" value="Acessar" />
    </label>

    <label>URL do link
      <input name="link_url" placeholder="https://" />
    </label>

    <label>Texto do lembrete (opcional)
      <textarea name="reminder_text" rows="2" placeholder="Ainda não viu? O link continua aqui"></textarea>
    </label>

    <label>Atraso do lembrete (minutos)
      <input name="reminder_delay_minutes" type="number" value="60" />
    </label>

    <button type="submit" class="btn">Criar automação</button>
    <div id="status"></div>
  </form>

<script>
async function loadMedia() {
  try {
    const res = await fetch('/api/media');
    const { media } = await res.json();
    const select = document.getElementById('media-select');
    (media || []).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = (m.caption || m.id).slice(0, 60);
      select.appendChild(opt);
    });
  } catch (e) {
    // silencioso: se o Instagram ainda não estiver conectado, só fica "Qualquer post"
  }
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  data.trigger_comment = form.trigger_comment.checked;
  data.trigger_story_reply = form.trigger_story_reply.checked;
  data.trigger_dm = form.trigger_dm.checked;

  const status = document.getElementById('status');
  status.textContent = 'Criando...';

  const res = await fetch('/api/automations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  if (res.ok) {
    window.location.href = '/dashboard.html';
  } else {
    const err = await res.json();
    status.textContent = 'Erro: ' + (err.error || 'tente novamente');
    status.style.color = 'red';
  }
});

loadMedia();
</script>
</body>
</html>
