<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova automação — Meu ManyChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
  .layout { display: grid; grid-template-columns: 1fr; gap: 32px; }
  @media (min-width: 900px) {
    body { max-width: 1040px; }
    .layout { grid-template-columns: 1fr 320px; align-items: start; }
  }

  /* --- grade de posts --- */
  .media-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 8px; max-height: 280px; overflow-y: auto; padding: 4px;
  }
  .media-card {
    position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
    border: 2px solid var(--border); cursor: pointer; background: var(--surface-2);
  }
  .media-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media-card.selected { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(5,140,215,0.25); }
  .media-card .check {
    position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent-blue); color: #fff; font-size: 11px; display: none;
    align-items: center; justify-content: center; font-weight: 700;
  }
  .media-card.selected .check { display: flex; }
  .media-card.any {
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-align: center; gap: 2px; padding: 4px;
  }
  .media-loading { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); padding: 12px 4px; }

  /* --- chips de variação --- */
  .chip-input-wrap {
    border: 0.5px solid var(--border); border-radius: 8px; padding: 8px; background: var(--surface);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .chip-input-wrap input {
    border: none; flex: 1; min-width: 140px; padding: 6px 4px; box-shadow: none;
  }
  .chip-input-wrap input:focus { box-shadow: none; }
  .variant-chip {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 12px; padding: 5px 6px 5px 10px;
    background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 999px;
  }
  .variant-chip button {
    background: none; border: none; color: var(--text-muted); font-size: 14px; line-height: 1;
    padding: 0 2px; cursor: pointer;
  }
  .variant-chip button:hover { color: var(--accent-red); }

  /* --- prévia estilo telefone --- */
  .phone-preview {
    position: sticky; top: 24px;
    border: 3px solid #000; border-radius: 28px; background: #fff;
    box-shadow: 4px 4px 0 #000; overflow: hidden;
  }
  .phone-bar {
    background: var(--surface-2); padding: 10px 14px; font-family: var(--font-mono);
    font-size: 10px; color: var(--text-muted); text-align: center; border-bottom: 0.5px solid var(--border);
  }
  .phone-screen { padding: 18px 14px; min-height: 280px; display: flex; flex-direction: column; gap: 10px; background: #efeee9; }
  .msg-bubble-in {
    align-self: flex-start; max-width: 85%; background: #fff; border: 0.5px solid var(--border);
    border-radius: 14px 14px 14px 3px; padding: 10px 13px; font-size: 13px; line-height: 1.4;
  }
  .qr-row { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 2px; }
  .qr-btn {
    font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px;
    border: 1.5px solid var(--accent-blue); color: var(--accent-blue); background: #fff;
  }
  .link-btn {
    align-self: flex-start; max-width: 85%; background: #fff; border: 0.5px solid var(--border);
    border-radius: 14px; overflow: hidden; font-size: 13px;
  }
  .link-btn .txt { padding: 10px 13px; }
  .link-btn .cta {
    text-align: center; padding: 10px; font-weight: 600; color: var(--accent-blue);
    border-top: 0.5px solid var(--border);
  }
  .preview-label {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px;
  }
</style>
</head>
<body>
  <a href="/dashboard.html" class="back">&larr; voltar pra central</a>
  <div class="eyebrow">novo sinal</div>
  <h1>Nova automação</h1>

  <div class="layout">
  <form id="form">
    <div class="field">
      <label>Nome da automação</label>
      <input name="name" required placeholder="Ex: Ebook grátis" />
    </div>

    <fieldset>
      <legend>Onde escutar</legend>
      <label class="check-row"><input type="checkbox" name="trigger_comment" checked /> Comentário em post/reels</label>
      <label class="check-row"><input type="checkbox" name="trigger_story_reply" /> Resposta a story</label>
      <label class="check-row"><input type="checkbox" name="trigger_dm" /> DM direta</label>
    </fieldset>

    <div class="field">
      <label>Palavras-chave <span class="hint">separadas por vírgula</span></label>
      <input name="keywords" placeholder="quero, link, eu quero" />
    </div>

    <div class="field">
      <label>Tipo de correspondência</label>
      <select name="match_type">
        <option value="contains">Contém a palavra</option>
        <option value="exact">Exatamente igual</option>
        <option value="any">Qualquer comentário</option>
      </select>
    </div>

    <div class="field">
      <label>Post/reels específico <span class="hint">opcional — clique numa imagem</span></label>
      <div class="media-grid" id="media-grid">
        <div class="media-card any selected" data-id="" data-thumb="">Qualquer<br/>post</div>
        <div class="media-loading">Carregando seus posts...</div>
      </div>
      <input type="hidden" name="target_media_id" id="target_media_id" value="" />
      <input type="hidden" name="target_media_thumb" id="target_media_thumb" value="" />
    </div>

    <div class="field">
      <label>Respostas públicas <span class="hint">variações — sorteia uma a cada comentário, opcional</span></label>
      <div class="chip-input-wrap" id="chip-wrap">
        <input id="chip-input" placeholder="Escreve uma variação e aperta Enter" />
      </div>
      <input type="hidden" name="public_replies" id="public_replies" value="" />
    </div>

    <div class="field">
      <label>Mensagem de boas-vindas (DM) <span class="hint">convite com botão — o link vem só depois</span></label>
      <textarea name="welcome_message" id="welcome_message" required rows="3" placeholder="Oi! Toca no botão abaixo pra receber o link"></textarea>
    </div>

    <div class="field">
      <label>Rótulo do botão de resposta rápida</label>
      <input name="quick_reply_label" id="quick_reply_label" value="Quero!" />
    </div>

    <div class="field">
      <label>Rótulo do botão do link</label>
      <input name="link_label" id="link_label" value="Acessar" />
    </div>

    <div class="field">
      <label>URL do link</label>
      <input name="link_url" placeholder="https://" />
    </div>

    <div class="field">
      <label>Texto do lembrete <span class="hint">opcional</span></label>
      <textarea name="reminder_text" rows="2" placeholder="Ainda não viu? O link continua aqui"></textarea>
    </div>

    <div class="field">
      <label>Atraso do lembrete <span class="hint">minutos</span></label>
      <input name="reminder_delay_minutes" type="number" value="60" />
    </div>

    <button type="submit" class="btn primary submit-btn">Criar automação</button>
    <div id="status"></div>
  </form>

  <aside>
    <div class="phone-preview">
      <div class="phone-bar">prévia da conversa</div>
      <div class="phone-screen">
        <div class="msg-bubble-in" id="preview-welcome">Oi! Toca no botão abaixo pra receber o link</div>
        <div class="qr-row"><span class="qr-btn" id="preview-qr">Quero!</span></div>
        <div class="preview-label">depois do clique</div>
        <div class="link-btn">
          <div class="txt" id="preview-welcome-2">Oi! Toca no botão abaixo pra receber o link</div>
          <div class="cta" id="preview-link-label">Acessar</div>
        </div>
      </div>
    </div>
  </aside>
  </div>

<script>
let selectedThumb = '';
const variants = [];
const params = new URLSearchParams(window.location.search);
const editId = params.get('id');

if (editId) {
  document.querySelector('h1').textContent = 'Editar automação';
  document.querySelector('.eyebrow').textContent = 'editando sinal';
  document.querySelector('.submit-btn').textContent = 'Salvar alterações';
}

async function loadForEdit() {
  if (!editId) return;
  const res = await fetch('/api/automations/' + editId);
  if (!res.ok) return;
  const { automation: a } = await res.json();
  const form = document.getElementById('form');
  form.name.value = a.name || '';
  form.trigger_comment.checked = a.trigger_comment;
  form.trigger_story_reply.checked = a.trigger_story_reply;
  form.trigger_dm.checked = a.trigger_dm;
  form.keywords.value = (a.keywords || []).join(', ');
  form.match_type.value = a.match_type || 'contains';
  form.welcome_message.value = a.welcome_message || '';
  form.quick_reply_label.value = a.quick_reply_label || 'Quero!';
  form.link_label.value = a.link_label || 'Acessar';
  form.link_url.value = a.link_url || '';
  form.reminder_text.value = a.reminder_text || '';
  form.reminder_delay_minutes.value = a.reminder_delay_minutes || 60;
  document.getElementById('target_media_id').value = a.target_media_id || '';
  document.getElementById('target_media_thumb').value = a.target_media_thumb || '';
  (a.public_replies || []).forEach(v => variants.push(v));
  renderVariants();
  updatePreview();
  markMediaSelected(a.target_media_id);
}

function markMediaSelected(mediaId) {
  document.querySelectorAll('.media-card').forEach(c => {
    const match = mediaId ? c.dataset.id === mediaId : c.classList.contains('any');
    c.classList.toggle('selected', match);
  });
}

// ---------- grade de posts ----------
async function loadMedia() {
  const grid = document.getElementById('media-grid');
  try {
    const res = await fetch('/api/media');
    const { media, error } = await res.json();
    const loading = grid.querySelector('.media-loading');
    if (loading) loading.remove();

    if (error) {
      const p = document.createElement('div');
      p.className = 'media-loading';
      p.textContent = 'Erro ao buscar posts: ' + error;
      grid.appendChild(p);
      return;
    }

    (media || []).forEach(m => {
      const img = m.thumbnail_url || m.media_url;
      const card = document.createElement('div');
      card.className = 'media-card';
      card.dataset.id = m.id;
      card.dataset.thumb = img || '';
      card.innerHTML = img
        ? `<img src="${img}" alt="" /><div class="check">✓</div>`
        : `<div class="check">✓</div>`;
      card.addEventListener('click', () => selectMedia(card));
      grid.appendChild(card);
    });

    grid.querySelector('.media-card.any').addEventListener('click', function () {
      selectMedia(this);
    });
  } catch (e) {
    grid.innerHTML = '<div class="media-loading">Não foi possível carregar os posts.</div>';
  }
}

function selectMedia(card) {
  document.querySelectorAll('.media-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  document.getElementById('target_media_id').value = card.dataset.id || '';
  document.getElementById('target_media_thumb').value = card.dataset.thumb || '';
}

// ---------- chips de variação ----------
const chipInput = document.getElementById('chip-input');
chipInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && chipInput.value.trim()) {
    e.preventDefault();
    addVariant(chipInput.value.trim());
    chipInput.value = '';
  }
});
function addVariant(text) {
  variants.push(text);
  renderVariants();
}
function removeVariant(i) {
  variants.splice(i, 1);
  renderVariants();
}
function renderVariants() {
  document.querySelectorAll('.variant-chip').forEach(c => c.remove());
  variants.forEach((v, i) => {
    const chip = document.createElement('span');
    chip.className = 'variant-chip';
    chip.innerHTML = `${escapeHtml(v)} <button type="button" onclick="removeVariant(${i})">&times;</button>`;
    chipInput.parentElement.insertBefore(chip, chipInput);
  });
  document.getElementById('public_replies').value = variants.join('\n');
}

// ---------- prévia ao vivo ----------
function updatePreview() {
  const welcome = document.getElementById('welcome_message').value || 'Oi! Toca no botão abaixo pra receber o link';
  const qr = document.getElementById('quick_reply_label').value || 'Quero!';
  const linkLabel = document.getElementById('link_label').value || 'Acessar';
  document.getElementById('preview-welcome').textContent = welcome;
  document.getElementById('preview-welcome-2').textContent = welcome;
  document.getElementById('preview-qr').textContent = qr;
  document.getElementById('preview-link-label').textContent = linkLabel;
}
['welcome_message', 'quick_reply_label', 'link_label'].forEach(id => {
  document.getElementById(id).addEventListener('input', updatePreview);
});

function escapeHtml(str) {
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  data.trigger_comment = form.trigger_comment.checked;
  data.trigger_story_reply = form.trigger_story_reply.checked;
  data.trigger_dm = form.trigger_dm.checked;
  data.public_replies = variants.join('\n');

  const status = document.getElementById('status');
  status.className = '';
  status.textContent = editId ? 'Salvando...' : 'Criando...';

  const res = await fetch(editId ? '/api/automations/' + editId : '/api/automations', {
    method: editId ? 'PATCH' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  if (res.ok) {
    status.className = 'ok';
    status.textContent = (editId ? 'Salvo' : 'Criada') + ' — voltando pra central...';
    window.location.href = '/dashboard.html';
  } else {
    const err = await res.json();
    status.className = 'error';
    status.textContent = 'Erro: ' + (err.error || 'tente novamente');
  }
});

loadMedia().then(loadForEdit);
updatePreview();
</script>
</body>
</html>
