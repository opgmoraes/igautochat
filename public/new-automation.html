<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova automação — Meu ManyChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<script src="/auth.js"></script>
<style>
  .layout { display: grid; grid-template-columns: 1fr; gap: 32px; }
  @media (min-width: 900px) {
    body { max-width: 1080px; }
    .layout { grid-template-columns: 1fr 320px; align-items: start; }
  }

  /* --- construtor de fluxo --- */
  .flow-list { display: flex; flex-direction: column; gap: 0; }
  .step-card {
    position: relative; border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    background: var(--surface); padding: 16px 18px; margin-bottom: 4px;
  }
  .step-card.link-step { border-color: var(--accent-green); border-width: 1.5px; background: #F3FBF7; }
  .step-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .step-badge {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono);
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted);
  }
  .step-badge .num {
    width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2);
    display: inline-flex; align-items: center; justify-content: center; color: var(--text-primary);
    font-weight: 700; font-size: 11px;
  }
  .link-step .step-badge .num { background: var(--accent-green); color: #fff; }
  .step-remove {
    background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px;
  }
  .step-remove:hover { color: var(--accent-red); }
  .step-connector {
    display: flex; align-items: center; justify-content: center; padding: 6px 0;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
  }
  .step-connector::before, .step-connector::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .step-connector span { padding: 0 10px; white-space: nowrap; }
  .step-row { display: flex; gap: 10px; }
  .step-row .grow { flex: 1; }
  .step-row .btn-field { width: 130px; flex-shrink: 0; }
  .add-step-btn { width: 100%; margin: 10px 0 4px; justify-content: center; border-style: dashed; }

  /* --- grade de posts --- */
  .media-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 8px; max-height: 240px; overflow-y: auto; padding: 4px;
  }
  .media-card {
    position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
    border: 2px solid var(--border); cursor: pointer; background: var(--surface-2);
  }
  .media-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media-card.selected { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(5,140,215,0.25); }
  .media-card .check {
    position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent-blue); color: #fff; font-size: 11px; display: none;
    align-items: center; justify-content: center; font-weight: 700;
  }
  .media-card.selected .check { display: flex; }
  .media-loading { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); padding: 12px 4px; }

  /* --- chips de variação --- */
  .chip-input-wrap {
    border: 0.5px solid var(--border); border-radius: 8px; padding: 8px; background: var(--surface);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .chip-input-wrap input { border: none; flex: 1; min-width: 140px; padding: 6px 4px; box-shadow: none; }
  .chip-input-wrap input:focus { box-shadow: none; }
  .variant-chip {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 12px; padding: 5px 6px 5px 10px;
    background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 999px;
  }
  .variant-chip button { background: none; border: none; color: var(--text-muted); font-size: 14px; line-height: 1; padding: 0 2px; cursor: pointer; }
  .variant-chip button:hover { color: var(--accent-red); }

  /* --- prévia estilo telefone --- */
  .phone-preview {
    position: sticky; top: 24px;
    border: 3px solid #000; border-radius: 28px; background: #fff;
    box-shadow: 4px 4px 0 #000; overflow: hidden;
  }
  .phone-bar {
    background: var(--surface-2); padding: 10px 14px; font-family: var(--font-mono);
    font-size: 10px; color: var(--text-muted); text-align: center; border-bottom: 0.5px solid var(--border);
  }
  .phone-screen { padding: 18px 14px; min-height: 200px; max-height: 560px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #efeee9; }
  .msg-bubble-in {
    align-self: flex-start; max-width: 88%; background: #fff; border: 0.5px solid var(--border);
    border-radius: 14px 14px 14px 3px; padding: 10px 13px; font-size: 13px; line-height: 1.4;
  }
  .qr-row { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 2px; }
  .qr-btn { font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--accent-blue); color: var(--accent-blue); background: #fff; }
  .link-btn { align-self: flex-start; max-width: 88%; background: #fff; border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; font-size: 13px; }
  .link-btn .txt { padding: 10px 13px; }
  .link-btn .cta { text-align: center; padding: 10px; font-weight: 600; color: var(--accent-blue); border-top: 0.5px solid var(--border); }
  .preview-tap { align-self: center; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin: 2px 0; }
  .preview-empty { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); text-align: center; padding: 30px 10px; }
</style>
</head>
<body>
  <a href="/dashboard.html" class="back">&larr; voltar pra central</a>
  <div class="eyebrow">novo sinal</div>
  <h1>Nova automação</h1>

  <div class="layout">
  <form id="form">
    <div class="field">
      <label>Nome da automação</label>
      <input name="name" required placeholder="Ex: Ebook grátis" />
    </div>

    <fieldset>
      <legend>Onde escutar</legend>
      <label class="check-row"><input type="checkbox" name="trigger_comment" checked /> Comentário em post/reels</label>
      <label class="check-row"><input type="checkbox" name="trigger_story_reply" /> Resposta a story</label>
      <label class="check-row"><input type="checkbox" name="trigger_dm" /> DM direta</label>
    </fieldset>

    <div class="field">
      <label>Palavras-chave <span class="hint">separadas por vírgula</span></label>
      <input name="keywords" placeholder="quero, link, eu quero" />
    </div>

    <div class="field">
      <label>Tipo de correspondência</label>
      <select name="match_type">
        <option value="contains">Contém a palavra</option>
        <option value="exact">Exatamente igual</option>
        <option value="any">Qualquer comentário</option>
      </select>
    </div>

    <div class="field">
      <label>Alvo do post <span class="hint">onde a automação vai escutar</span></label>
      <fieldset style="margin-bottom:0">
        <label class="check-row"><input type="radio" name="target_mode" value="any" checked /> Qualquer post</label>
        <label class="check-row"><input type="radio" name="target_mode" value="specific" /> Post específico (já publicado)</label>
        <label class="check-row"><input type="radio" name="target_mode" value="latest" /> Meu próximo post <span class="hint">funciona com agendados</span></label>
      </fieldset>
      <p id="latest-hint" style="display:none;font-size:12px;color:var(--text-secondary);margin:8px 0 0">
        Assim que você publicar (ou um agendado sair do forno), essa automação passa a valer pra ele automaticamente.
      </p>
      <div class="media-grid" id="media-grid" style="margin-top:12px;display:none">
        <div class="media-loading">Carregando seus posts...</div>
      </div>
      <input type="hidden" name="target_media_id" id="target_media_id" value="" />
      <input type="hidden" name="target_media_thumb" id="target_media_thumb" value="" />
    </div>

    <div class="field">
      <label>Respostas públicas <span class="hint">variações — sorteia uma a cada comentário, opcional</span></label>
      <div class="chip-input-wrap" id="chip-wrap">
        <input id="chip-input" placeholder="Escreve uma variação e aperta Enter" />
      </div>
      <input type="hidden" name="public_replies" id="public_replies" value="" />
    </div>

    <div class="field" style="margin-top:28px">
      <label style="font-size:14px;color:var(--text-primary)">Fluxo de mensagens <span class="hint">na ordem que a pessoa vai receber</span></label>
      <div class="flow-list" id="flow-list"></div>
      <button type="button" class="btn add-step-btn" id="add-step-btn">+ Adicionar mensagem</button>
    </div>

    <fieldset style="margin-top:10px">
      <legend>Lembrete depois do link (opcional)</legend>
      <div class="field">
        <label>Texto do lembrete</label>
        <textarea name="reminder_text" id="reminder_text" rows="2" placeholder="Ainda não viu? O link continua aqui"></textarea>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Atraso <span class="hint">minutos depois do link ser enviado</span></label>
        <input name="reminder_delay_minutes" type="number" value="60" style="max-width:140px" />
      </div>
    </fieldset>

    <button type="submit" class="btn primary submit-btn" style="margin-top:20px">Criar automação</button>
    <div id="status"></div>
  </form>

  <aside>
    <div class="phone-preview">
      <div class="phone-bar">prévia da conversa</div>
      <div class="phone-screen" id="phone-screen">
        <div class="preview-empty">Adiciona uma mensagem pra ver a prévia aqui</div>
      </div>
    </div>
  </aside>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const editId = params.get('id');

if (editId) {
  document.querySelector('h1').textContent = 'Editar automação';
  document.querySelector('.eyebrow').textContent = 'editando sinal';
  document.querySelector('.submit-btn').textContent = 'Salvar alterações';
}

// ---------- estado do fluxo ----------
let steps = [
  { type: 'message', text: '', button_label: 'Quero!' },
  { type: 'link', text: '', link_label: 'Acessar', link_url: '' },
];
const variants = [];

function escapeHtml(str) {
  const d = document.createElement('div');
  d.innerText = str || '';
  return d.innerHTML;
}

// ---------- construtor de etapas ----------
function renderFlow() {
  const list = document.getElementById('flow-list');
  list.innerHTML = steps.map((s, i) => {
    const isLink = s.type === 'link';
    const badgeLabel = isLink ? 'etapa final · link' : `mensagem ${i + 1}`;
    const removeBtn = isLink ? '' : `<button type="button" class="step-remove" onclick="removeStep(${i})">&times;</button>`;

    if (isLink) {
      return `
        <div class="step-card link-step">
          <div class="step-top">
            <span class="step-badge"><span class="num">${i + 1}</span> ${badgeLabel}</span>
          </div>
          <div class="field" style="margin-bottom:8px">
            <label>Texto que acompanha o link</label>
            <textarea rows="2" placeholder="Aqui está! 👇" oninput="updateStep(${i}, 'text', this.value)">${escapeHtml(s.text)}</textarea>
          </div>
          <div class="step-row">
            <div class="grow field" style="margin-bottom:0">
              <label>URL do link</label>
              <input placeholder="https://" value="${escapeHtml(s.link_url)}" oninput="updateStep(${i}, 'link_url', this.value)" />
            </div>
            <div class="btn-field field" style="margin-bottom:0">
              <label>Rótulo do botão</label>
              <input value="${escapeHtml(s.link_label)}" oninput="updateStep(${i}, 'link_label', this.value)" />
            </div>
          </div>
        </div>`;
    }

    return `
      <div class="step-card">
        <div class="step-top">
          <span class="step-badge"><span class="num">${i + 1}</span> ${badgeLabel}</span>
          ${removeBtn}
        </div>
        <div class="field" style="margin-bottom:8px">
          <label>Mensagem</label>
          <textarea rows="2" placeholder="Oi! Toca no botão pra continuar" oninput="updateStep(${i}, 'text', this.value)">${escapeHtml(s.text)}</textarea>
        </div>
        <div class="field" style="margin-bottom:0;max-width:200px">
          <label>Rótulo do botão</label>
          <input value="${escapeHtml(s.button_label)}" oninput="updateStep(${i}, 'button_label', this.value)" />
        </div>
      </div>
      <div class="step-connector"><span>clique</span></div>`;
  }).join('');
  updatePreview();
}

function updateStep(i, field, value) {
  steps[i][field] = value;
  updatePreview();
}

function removeStep(i) {
  steps.splice(i, 1);
  renderFlow();
}

document.getElementById('add-step-btn').addEventListener('click', () => {
  // insere uma nova mensagem logo antes da etapa final (o link)
  steps.splice(steps.length - 1, 0, { type: 'message', text: '', button_label: 'Continuar' });
  renderFlow();
});

// ---------- prévia ao vivo ----------
function updatePreview() {
  const screen = document.getElementById('phone-screen');
  const hasContent = steps.some(s => s.text && s.text.trim());
  if (!hasContent) {
    screen.innerHTML = '<div class="preview-empty">Adiciona uma mensagem pra ver a prévia aqui</div>';
    return;
  }

  screen.innerHTML = steps.map((s, i) => {
    if (s.type === 'link') {
      return `
        <div class="link-btn">
          <div class="txt">${escapeHtml(s.text) || 'Aqui está!'}</div>
          <div class="cta">${escapeHtml(s.link_label) || 'Acessar'}</div>
        </div>`;
    }
    return `
      <div class="msg-bubble-in">${escapeHtml(s.text) || '...'}</div>
      <div class="qr-row"><span class="qr-btn">${escapeHtml(s.button_label) || 'Continuar'}</span></div>
      <div class="preview-tap">↳ pessoa toca no botão</div>`;
  }).join('');
}

// ---------- alvo do post ----------
document.querySelectorAll('input[name="target_mode"]').forEach(r => r.addEventListener('change', updateTargetModeUI));
function updateTargetModeUI() {
  const mode = document.querySelector('input[name="target_mode"]:checked').value;
  document.getElementById('media-grid').style.display = mode === 'specific' ? '' : 'none';
  document.getElementById('latest-hint').style.display = mode === 'latest' ? '' : 'none';
  if (mode !== 'specific') {
    document.getElementById('target_media_id').value = '';
    document.getElementById('target_media_thumb').value = '';
  }
}

async function loadMedia() {
  const grid = document.getElementById('media-grid');
  try {
    const res = await authFetch('/api/media');
    const { media, error } = await res.json();
    const loading = grid.querySelector('.media-loading');
    if (loading) loading.remove();
    if (error) {
      grid.innerHTML = `<div class="media-loading">Erro ao buscar posts: ${error}</div>`;
      return;
    }
    (media || []).forEach(m => {
      const img = m.thumbnail_url || m.media_url;
      const card = document.createElement('div');
      card.className = 'media-card';
      card.dataset.id = m.id;
      card.dataset.thumb = img || '';
      card.innerHTML = img ? `<img src="${img}" alt="" /><div class="check">✓</div>` : `<div class="check">✓</div>`;
      card.addEventListener('click', () => selectMedia(card));
      grid.appendChild(card);
    });
  } catch (e) {
    grid.innerHTML = '<div class="media-loading">Não foi possível carregar os posts.</div>';
  }
}
function selectMedia(card) {
  document.querySelectorAll('.media-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  document.getElementById('target_media_id').value = card.dataset.id || '';
  document.getElementById('target_media_thumb').value = card.dataset.thumb || '';
}
function markMediaSelected(mediaId) {
  document.querySelectorAll('.media-card').forEach(c => c.classList.toggle('selected', mediaId && c.dataset.id === mediaId));
}

// ---------- chips de variação ----------
const chipInput = document.getElementById('chip-input');
chipInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && chipInput.value.trim()) {
    e.preventDefault();
    variants.push(chipInput.value.trim());
    chipInput.value = '';
    renderVariants();
  }
});
function removeVariant(i) { variants.splice(i, 1); renderVariants(); }
function renderVariants() {
  document.querySelectorAll('.variant-chip').forEach(c => c.remove());
  variants.forEach((v, i) => {
    const chip = document.createElement('span');
    chip.className = 'variant-chip';
    chip.innerHTML = `${escapeHtml(v)} <button type="button" onclick="removeVariant(${i})">&times;</button>`;
    chipInput.parentElement.insertBefore(chip, chipInput);
  });
  document.getElementById('public_replies').value = variants.join('\n');
}

// ---------- carregar pra edição ----------
async function loadForEdit() {
  if (!editId) { renderFlow(); return; }
  const res = await authFetch('/api/automations/' + editId);
  if (!res.ok) { renderFlow(); return; }
  const { automation: a } = await res.json();
  const form = document.getElementById('form');
  form.name.value = a.name || '';
  form.trigger_comment.checked = a.trigger_comment;
  form.trigger_story_reply.checked = a.trigger_story_reply;
  form.trigger_dm.checked = a.trigger_dm;
  form.keywords.value = (a.keywords || []).join(', ');
  form.match_type.value = a.match_type || 'contains';
  form.reminder_text.value = a.reminder_text || '';
  form.reminder_delay_minutes.value = a.reminder_delay_minutes || 60;
  document.getElementById('target_media_id').value = a.target_media_id || '';
  document.getElementById('target_media_thumb').value = a.target_media_thumb || '';
  const modeRadio = document.querySelector(`input[name="target_mode"][value="${a.target_mode || 'any'}"]`);
  if (modeRadio) modeRadio.checked = true;
  updateTargetModeUI();

  if (Array.isArray(a.steps) && a.steps.length > 0) {
    steps = a.steps;
  }

  (a.public_replies || []).forEach(v => variants.push(v));
  renderVariants();
  renderFlow();
  markMediaSelected(a.target_media_id);
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  data.trigger_comment = form.trigger_comment.checked;
  data.trigger_story_reply = form.trigger_story_reply.checked;
  data.trigger_dm = form.trigger_dm.checked;
  data.public_replies = variants.join('\n');
  data.steps = steps;

  const status = document.getElementById('status');
  status.className = '';
  status.textContent = editId ? 'Salvando...' : 'Criando...';

  const res = await authFetch(editId ? '/api/automations/' + editId : '/api/automations', {
    method: editId ? 'PATCH' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  if (res.ok) {
    status.className = 'ok';
    status.textContent = (editId ? 'Salvo' : 'Criada') + ' — voltando pra central...';
    window.location.href = '/dashboard.html';
  } else {
    const err = await res.json();
    status.className = 'error';
    status.textContent = 'Erro: ' + (err.error || 'tente novamente');
  }
});

(async () => {
  const session = await window.requireAuth();
  if (!session) return;
  await loadMedia();
  await loadForEdit();
})();
</script>
</body>
</html>
