<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — igautochat</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-box {
    width: 100%; max-width: 340px; background: var(--surface);
    border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 36px 28px; text-align: center; box-shadow: 0 0 40px -8px rgba(5,140,215,0.25);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .login-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 4px 0 6px; }
  .login-sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 22px; }
  #login-form { display: flex; flex-direction: column; gap: 10px; }
  .login-error { color: var(--accent-red); font-size: 12.5px; margin: 12px 0 0; min-height: 16px; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="login-box">
    <div class="eyebrow" style="justify-content:center"><img src="/logo.png" alt="" style="width:20px;height:20px;border-radius:5px" onerror="this.style.display='none'" /> painel · instagram</div>
    <div class="login-title">igautochat</div>
    <p class="login-sub">Entre com seu e-mail e senha</p>
    <form id="login-form">
      <input type="email" id="email" placeholder="E-mail" required autofocus />
      <input type="password" id="password" placeholder="Senha" required />
      <button type="submit" class="btn primary submit-btn" id="submit-btn">Entrar</button>
    </form>
    <div class="login-error" id="login-error"></div>
  </div>

<script src="/auth.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('submit-btn');
  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const sb = await window.initAuth();
  const { error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    errorEl.textContent = 'E-mail ou senha incorretos.';
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  window.location.href = '/dashboard.html';
});

// Se já estiver logado, pula direto pro painel
(async () => {
  const sb = await window.initAuth();
  const { data: { session } } = await sb.auth.getSession();
  if (session) window.location.href = '/dashboard.html';
})();
</script>
</body>
</html>
